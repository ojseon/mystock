<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Chart Explorer</title>
    <!-- 구글 폰트 추가 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    <style>
        /* 기본 스타일 */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 300px;
            margin: 0;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            font-weight: 700;
            color: #333;
            margin-bottom: 2px;
        }

        .group-title {
            font-weight: 700;
            color: #007bff;
            border-bottom: 2px solid #007bff;
            padding-bottom: 1px;
            margin-top: 2px;
            margin-bottom: 1px;
        }

        .stock-list ul {
            list-style-type: none;
            padding: 0;
        }

        .stock-list li {
            display: inline-block;
            margin-right: 10px;
            margin-bottom: 1px;
        }

        .stock-list a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            font-size: 1em;
            padding: 2px 3px;
            display: inline-block;
            border-radius: 4px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .stock-list a:hover {
            background-color: #007bff;
            color: #fff;
        }

        .ratio-buttons {
            margin-top: 30px;
            text-align: left;
        }

        .ratio-buttons label {
            font-size: 1.1em;
            font-weight: 500;
            margin-right: 10px;
        }

        .ratio-buttons button {
            margin-right: 5px;
            padding: 2px 4px;
            font-size: 16px;
            cursor: pointer;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            transition: background-color 0.3s ease, color 0.3s ease, border 0.3s ease;
        }

        .ratio-buttons button.selected {
            background-color: #007bff;
            color: white;
            border: 1px solid #0056b3;
        }

        .ratio-buttons button:hover {
            background-color: #007bff;
            color: white;
            border: 1px solid #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>100억 부자!</h1>
        <div class="stock-list">
            <div class="group-title">공부 (좋은주식, 항상 부등호 쳐보기!)</div>
            <ul id="study-link-list"></ul>
            
            <div class="group-title">국내동업기업<a href="#" onclick="openChart('https://kr.tradingview.com/screener/SGTc8Yty/?utm_source=chatgpt.com')">RSI</a></div>
            <ul id="korean-stock-list"></ul>

            <div class="group-title">해외동업기업<a href="#" id="foreign-rsi" onclick="openChart('https://elite.finviz.com/screener.ashx?v=171&ft=2&o=rsi')">RSI</a></div>
            <ul id="foreign-stock-list"></ul>

            <div class="group-title">기타<a href="#" id="etc-rsi" onclick="openChart('https://elite.finviz.com/screener.ashx?v=171&ft=2&o=rsi')">RSI</a></div>
            <ul id="etc-stock-list"></ul>
        </div>

        <div class="ratio-buttons">
            <label>새창위치</label>
            <button onclick="setRatio(2, this)">2</button>
            <button onclick="setRatio(3, this)">3</button>
            <button onclick="setRatio(5, this)" class="selected">4</button>
            <button onclick="setRatio(4, this)">5</button>
            <button onclick="setRatio(6, this)">6</button>
        </div>
    </div>

    <script>
        // =========================================================
        // [설정 1] 국내 관심 종목 목록 (종목명, 6자리 종목코드)
        // =========================================================
        const koreanStocks = [
            { name: "KODEX200", code: "069500" },
            { name: "SK하이닉스", code: "000660" },
            { name: "삼성전자", code: "005930" },
            { name: "삼성생명", code: "032830" },
            { name: "삼양식품", code: "003230" },
            { name: "한화에어로", code: "012450" },
            { name: "LIG넥스원", code: "079550" },
            { name: "삼성전기", code: "009150" },
            { name: "삼성증권", code: "016360" },
            { name: "SK스퀘어", code: "402340" },
            { name: "현대차", code: "005380" },
            { name: "현대모비스", code: "012330" },
            { name: "SK텔레콤", code: "017670" }
        ];

        // =========================================================
        // [설정 2] 해외 관심 종목 목록 (티커 나열)
        // =========================================================
        const foreignStocks = "GOOGL,TSM,SKHY,SNDK,MRVL,NVDA,MU,AMZN,META,MSFT,PLTR,TSLA,SPCX,AAPL,AVGO,QQQ,SPY,SMH,EWY";

        // =========================================================
        // [설정 3] 기타 관심 종목 목록 (티커 나열)
        // =========================================================
        const etcStocks = "LEU,MP,IONQ,QBTS,SMR,CBRS";


        // 1. 공부 그룹 동적 생성
        function initStudyLinks() {
            const listUl = document.getElementById('study-link-list');

            const studyRsiUrl = `https://elite.finviz.com/screener.ashx?v=171&ft=2&t=${foreignStocks}&o=rsi`;
            const studyRsiTUrl = `https://elite.finviz.com/screener.ashx?v=351&ft=2&t=${foreignStocks}&o=rsi`;

            let htmlContent = `
                <li><a href="#" onclick="openChart('https://contents.premium.naver.com/hsacademy/hsacademy1')">아카데미</a></li>
                <li><a href="#" onclick="openChart('https://us.cnn.com/markets/fear-and-greed')">F&G</a></li>
                <li><a href="#" onclick="openChart('https://www.cnbc.com/quotes/.VIX')">VIX</a></li>
                <li><a href="#" onclick="openChart('https://www.cnbc.com/quotes/.KSVKOSPI')">(국내)</a></li>
                <li><a href="#" onclick="openChart('https://finviz.com/map.ashx?t=sec_all')">MAP(해외)</a></li>
                <li><a href="#" onclick="openChart('https://www.kospd.com/maps/1day')">(국내)</a></li>
                <li><a href="#" onclick="openChart('${studyRsiUrl}')">RSI</a> <a href="#" onclick="openChart('${studyRsiTUrl}')">(T)</a></li>
                <li><a href="#" onclick="openChart('https://companiesmarketcap.com/?utm_source=chatgpt.com#google_vignette')">세계시총</a> <a href="#" onclick="openChart0('https://www.tradingview.com/markets/world-stocks/worlds-largest-companies/?utm_source=chatgpt.com')">(2)</a></li>
                <li><a href="#" onclick="openChart('https://www.cnbc.com')">CNBC</a> <a href="#" onclick="openChart0('https://www.cnbc.com/watchlist/#!/watchlist/2773881')">(P)</a></li>
                <li><a href="#" onclick="openChart('https://finance.yahoo.com/')">Yahoo.F</a> <a href="#" onclick="openChart('https://finance.yahoo.com/portfolio/p_0/view/view_0')">(해외)</a> <a href="#" onclick="openChart('https://finance.yahoo.com/portfolio/p_1/view/view_1')">(국내)</a></li>
                <li><a href="#" onclick="openChart('https://kr.investing.com/portfolio/?portfolioID=ZWE2ZTRlNmpmOWpvMmlhYA%3D%3D')">INVST</a></li>
                <li><a href="#" onclick="openChart('https://www.investing.com/currencies/usd-krw')">환율</a></li>
                <li><a href="#" onclick="openChart('https://www.cnbc.com/quotes/@ND.1')">나스닥선물</a></li>
                <li><a href="#" onclick="openChart('https://search.naver.com/search.naver?where=news&ie=utf8&sm=nws_hty&query=%EC%97%94%EB%B9%84%EB%94%94%EC%95%84')">N뉴스</a></li>
                <li><a href="#" onclick="openChart('https://github.com/ojseon/mystock')">GitHub</a></li>
                <li><a href="#" onclick="openMenu('https://ojseon.github.io/mystock/#')">왼쪽창열기</a></li>
            `;

            listUl.innerHTML = htmlContent;
        }

        // 2. 국내 주식 목록 동적 생성
        function initKoreanStocks() {
            const listUl = document.getElementById('korean-stock-list');

            let htmlContent = `
                <li><a href="#" onclick="openChart('https://finance.naver.com/sise/')">국내</a></li>
                <li><a href="#" onclick="openChart('https://finance.naver.com/sise/sise_market_sum.naver')">시총순위</a></li>
                <li><a href="#" onclick="openChart('https://finance.naver.com/mystock/itemList.naver')">(My)</a></li>
                <li><a href="#" onclick="openChart('https://finance.naver.com/sise/sise_index.naver?code=KOSDPI')">코스피</a></li>
                <li><a href="#" onclick="openChart('https://finance.naver.com/sise/sise_index.naver?code=KOSDAQ')">코스닥</a></li>
                <li><a href="#" onclick="openChart('https://finance.naver.com/sise/sise_index.naver?code=FUT')">선물</a></li>
            `;

            koreanStocks.forEach(stock => {
                const url = `https://finance.naver.com/item/fchart.naver?code=${stock.code}`;
                htmlContent += `<li><a href="#" onclick="openChart('${url}')">${stock.name}</a></li>`;
            });

            listUl.innerHTML = htmlContent;
        }

        // 3. 해외 주식 목록 동적 생성
        function initForeignStocks() {
            const stockArray = foreignStocks.split(',').map(s => s.trim()).filter(Boolean);
            const listUl = document.getElementById('foreign-stock-list');

            let htmlContent = `
                <li><a href="#" onclick="openChart('https://finviz.com/')">종합</a></li>
                <li><a href="#" onclick="openChart('https://finance.naver.com/world/')">해외</a></li>
            `;

            stockArray.forEach(ticker => {
                const url = `https://finviz.com/quote.ashx?t=${ticker}&ty=c&p=d&b=1`;
                htmlContent += `<li><a href="#" onclick="openChart('${url}')">${ticker}</a></li>`;
            });

            listUl.innerHTML = htmlContent;

            const foreignRsiUrl = `https://elite.finviz.com/screener.ashx?v=171&ft=2&t=${foreignStocks}&o=rsi`;
            document.getElementById('foreign-rsi').setAttribute('onclick', `openChart('${foreignRsiUrl}')`);
        }

        // 4. 기타 주식 목록 동적 생성
        function initEtcStocks() {
            const stockArray = etcStocks.split(',').map(s => s.trim()).filter(Boolean);
            const listUl = document.getElementById('etc-stock-list');

            let htmlContent = "";

            stockArray.forEach(ticker => {
                const url = `https://finviz.com/quote.ashx?t=${ticker}&ty=c&p=d&b=1`;
                htmlContent += `<li><a href="#" onclick="openChart('${url}')">${ticker}</a></li>`;
            });

            htmlContent += `<li><a href="#" onclick="openChart('https://upbit.com/exchange?code=CRIX.UPBIT.KRW-BTC')">BTC/DOGE</a></li>`;

            listUl.innerHTML = htmlContent;

            const etcRsiUrl = `https://elite.finviz.com/screener.ashx?v=171&ft=2&t=${etcStocks}&o=rsi`;
            document.getElementById('etc-rsi').setAttribute('onclick', `openChart('${etcRsiUrl}')`);
        }

        // 페이지 로드시 초기화
        window.addEventListener('DOMContentLoaded', () => {
            initStudyLinks();
            initKoreanStocks();
            initForeignStocks();
            initEtcStocks();
        });

        var selectedRatio = 4; // 기본 비율 설정값

        function setRatio(ratio, button) {
            selectedRatio = ratio;

            var buttons = document.querySelectorAll('.ratio-buttons button');
            buttons.forEach(function(btn) {
                btn.classList.remove('selected');
            });

            button.classList.add('selected');
        }

        function openMenu(url) {
            var screenWidth = window.screen.width;
            var screenHeight = window.screen.height;

            var newWidth = 350;
            var newLeft = 0;

            window.open(url, 'lm1', `width=${newWidth},height=${screenHeight},left=${newLeft},top=0`);
        }

        function openChart0(url) {
            var screenWidth = window.screen.width;
            var screenHeight = window.screen.height;

            var newWidth = screenWidth * (selectedRatio - 1) / selectedRatio;
            var newLeft = screenWidth - newWidth;

            window.open(url, 'gr0', `width=${newWidth},height=${screenHeight},left=${newLeft},top=0`);
        }

        function openChart(url) {
            var screenWidth = window.screen.width;
            var screenHeight = window.screen.height;

            var newWidth = screenWidth * (selectedRatio - 1) / selectedRatio;
            var newLeft = screenWidth - newWidth;

            window.open(url, 'gr1', `width=${newWidth},height=${screenHeight},left=${newLeft},top=0`);
        }
    </script>
</body>
</html>
